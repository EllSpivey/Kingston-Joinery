<script>
$(document).ready(function(){
    $('#gallery a').click(function(){
        var galleryHref = $(this).attr('href');
        var galleryAlt = $(this).attr('title');

        // Reset any inherited thumbnail dimensions
        $('figure img')
            .removeAttr('width')
            .removeAttr('height')
            .css({ width: '', height: '' })
            .attr({ src: galleryHref, alt: galleryAlt });

        $('figcaption').html(galleryAlt);

        $('figure').css('display','none').fadeToggle(800);

        return false;
    });
});
</script>
</head>
